name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-and-race:
    name: Go vet and race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Vet and race-test every Go module
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- go.mod '**/go.mod' > "$RUNNER_TEMP/go-modules"
          if [[ ! -s "$RUNNER_TEMP/go-modules" ]]; then
            echo 'No tracked Go modules found' >&2
            exit 1
          fi
          status=0
          while IFS= read -r -d '' mod; do
            module_dir=$(dirname "$mod")
            echo "::group::$module_dir: go vet ./..."
            (cd "$module_dir" && go vet ./...) || status=1
            echo '::endgroup::'
            echo "::group::$module_dir: go test -race ./..."
            (cd "$module_dir" && go test -race ./...) || status=1
            echo '::endgroup::'
          done < "$RUNNER_TEMP/go-modules"
          exit "$status"
